modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-heft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Chunkworks"
# Everything it draws is on the client; on a server it only adds item tags. Either side may go without it.
displayTest="IGNORE_ALL_VERSION"
description='''
Every flat item becomes a solid one: in the hand, on the ground and set down, each made from the
art your resource packs already give it, raised by what it is (a fruit round, a loaf domed, a cookie
a thin disc, an ingot a bevelled bar) or given depth. Slots and item frames keep the flat icon.
'''

[[mixins]]
    config="heft.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
